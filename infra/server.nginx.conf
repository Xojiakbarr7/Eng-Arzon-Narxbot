# Host Ubuntu Nginx configuration, not the Nginx inside Docker.
# Replace bot.example.uz with your domain, then let Certbot add HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name bot.example.uz;

    client_max_body_size 3m;

    # Bot workers call the API container directly; this route is not public.
    location ^~ /api/internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}

