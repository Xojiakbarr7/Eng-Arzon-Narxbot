# Wake Render around 09:05 Asia/Tashkent daily.
# The DB's daily_runs unique claim guards against duplicate postings.
name: Wake daily product collector
on:
  schedule:
    - cron: '5 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wake backend so its scheduled collector can run
        shell: bash
        run: |
          set -eu
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 60 \
                "https://eng-arzon-narxbot-2.onrender.com/api/health"; then
              exit 0
            fi
            sleep 20
          done
          exit 1
